name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Replicate model destination (r8.im/<username>/<model>)"
        required: false
        default: "r8.im/mamorett/qwen21-replicate-fine-tuner"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install latest Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Log in to Replicate
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_API_TOKEN || secrets.COG_TOKEN }}
        run: |
          if [ -z "$REPLICATE_TOKEN" ]; then
            echo "::error::Neither REPLICATE_API_TOKEN nor COG_TOKEN secret is set in GitHub repository secrets!"
            exit 1
          fi
          printf '%s' "$REPLICATE_TOKEN" | cog login --token-stdin

      - name: Push to Replicate
        run: |
          cog push ${{ github.event.inputs.model_name || 'r8.im/mamorett/qwen21-replicate-fine-tuner' }}
