name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Replicate model destination (r8.im/<username>/<model>)"
        required: false
        default: "r8.im/mamorett/qwen21-replicate-fine-tuner"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Cog
        uses: replicate/setup-cog@v2
        with:
          token_input: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Push to Replicate
        run: |
          cog push ${{ github.event.inputs.model_name || 'r8.im/mamorett/qwen21-replicate-fine-tuner' }}
